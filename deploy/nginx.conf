# custodian multi-replica load balancing (Phase F, docs/SCALE_OUT.md §5-F). Mounted into the nginx
# container at /etc/nginx/conf.d/default.conf.
#
# Design notes (Phase F review, implemented point by point):
#  1. **Open-source nginx has no active health checks** (that's a Plus feature) -- only passive
#     max_fails/fail_timeout + proxy_next_upstream retries.
#     So making "docker kill on a replica unnoticeable" relies on proxy_next_upstream: hitting a dead
#     replica's connect failure -> nginx retries against the next replica.
#  2. **Docker DNS + dynamic upstream resolution**: in open-source nginx, upstream `server ... resolve`
#     has been available since 1.27.3 (the image is pinned to 1.27).
#     With resolver 127.0.0.11 (Docker's embedded DNS) + an upstream zone configured, nginx round-robins
#     across **all replica IPs** returned for the `custodian` service name,
#     and scaling replicas up/down with `--scale custodian=N` takes effect within the valid= window --
#     it's not "resolved once at startup and then frozen" (a classic pitfall this config avoids).
#  3. **POST requests are also retried** (non_idempotent): /v1/retrieve and /v1/ask are POST, and by
#     default nginx does not retry non-idempotent requests across replicas;
#     retrieve is read-only in semantics and ask is idempotent (resending just recomputes it once more),
#     so non_idempotent is explicitly added -- an **in-flight** request on a killed replica
#     can also land on a healthy replica, achieving "unnoticeable" (not just "requests that never hit
#     the dead replica are unaffected"). Cost: in extreme cases ask may trigger the LLM twice, which is
#     acceptable.
#  4. **Short connect timeout**: connecting to a dead replica waits 60s by default; setting it to 2s
#     fails fast into a retry, so a kill is worked around within seconds.

resolver 127.0.0.11 valid=10s ipv6=off;      # Docker's embedded DNS; valid=10s -> scaling replicas up/down is reflected in the round-robin set within 10s

upstream custodian_pool {
    zone custodian_pool 64k;                      # shared memory zone: required for upstream `resolve` to dynamically update the replica set
    server custodian:8787 resolve max_fails=1 fail_timeout=5s;   # round-robins across all replica IPs from DNS; passive ejection (1 failure -> not selected again for 5s)
    keepalive 32;                             # keepalive pool of connections to the upstream (reduces TCP handshake overhead)
}

server {
    listen 80;

    # nginx's own liveness probe (only proves the nginx process is up; does not mean the backend is ready -- check custodian's /readyz for backend readiness)
    location = /_nginx_health { access_log off; return 200 "nginx ok\n"; }

    location / {
        proxy_pass http://custodian_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # reuse the keepalive connection to the upstream
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # docker kill on a replica is unnoticeable: connection failure/timeout/gateway 5xx -> retry against the next replica (non_idempotent lets POST retry too)
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;           # try at most 3 replicas (avoids infinite retries if all replicas are down)
        proxy_next_upstream_timeout 15s;

        proxy_connect_timeout 2s;              # fail fast connecting to a dead replica (default 60s is too long, a kill would stall)
        proxy_read_timeout 130s;               # > inference read 120s; /v1/ask goes through the LLM and may take longer, raise as needed
        proxy_send_timeout 10s;
    }
}
